<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#10b981">
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../assets/images/sipelita-app.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Administrasi Sekolah Terintegrasi</title>
    <link rel="icon" type="image/png" href="assets/images/sipelita-app.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chat-widget.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script> <!-- ✅ BARU -->
    <script src="js/alarm-engine.js"></script>
    <!-- 🔒 CEK KEAMANAN SINCRONOUS (Mencegah Flash Halaman Dashboard) -->
    <script>
      (function() {
        // Cek apakah ada data session user di localStorage
        // (Sesuaikan 'sipelita_user' dengan key localStorage yang Anda gunakan)
        const sessionData = localStorage.getItem('sipelita_user');
        
        if (!sessionData) {
          // Jika TIDAK ADA data login, redirect INSTAN ke halaman login
          // window.location.replace() mencegah user menekan tombol "Back" di browser
          window.location.replace('home.html'); 
        }
      })();
    </script>
    
    <style>
        /* Style Khusus untuk Tombol Pengaturan Akun */
        .btn-settings-akun {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #475569;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.2s ease;
        }
        .btn-settings-akun:hover {
            background: #e2e8f0;
            color: #0f172a;
            transform: rotate(45deg);
        }
        
        /* Style Form di dalam Modal */
        .form-group-modal {
            margin-bottom: 16px;
        }
        .form-group-modal label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        .form-group-modal input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box; /* Penting agar padding tidak merusak lebar */
        }
        .form-group-modal input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        .password-hint {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div style="display: flex; align-items: center; gap: 15px;">
                <img src="assets/images/sipelita-app.png" alt="Logo SIPELITA" class="header-logo">
                <div>
                    <h1 style="margin: 0; font-size: 1.4rem;">SIPELITA</h1>
                    <p style="margin: 0; font-size: 0.85rem;">Sistem Pengelolaan Edukasi & Layanan Terpadu</p>
                </div>
            </div>
            
            <div id="userPanel" style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px; margin-left: auto;">
                <!-- Baris 1: Role, Settings & Logout -->
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span id="userRole" style="background: #ffd700; color: #1a237e; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600;"></span>
                    
                    <!-- TOMBOL PENGATURAN AKUN (GERIGI) -->
                    <button id="btnPengaturanAkun" class="btn-settings-akun" title="Pengaturan Akun">
                        <i class="fas fa-cog"></i>
                    </button>
                    
                    <button id="btnLogout" style="background: #f44336; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500;">Logout</button>
                </div>
                
                <!-- Baris 2: Sapaan Nama User -->
                <span id="userName" style="color: #0f172a; font-weight: bold; font-size: 0.95rem;">Hi, ...</span>
                
                <!-- Baris 3: NIP User -->
                <span id="userNip" style="color: #64748b; font-size: 0.8rem; font-family: 'Courier New', monospace;"></span>
            </div>
        </header>

        <h2 class="section-title">Layanan Umum</h2>
        <div class="grid" id="layanan-umum"></div>

        <h2 class="section-title">Layanan Madrasah</h2>
        <div class="grid" id="layanan-madrasah"></div>
    </div>
    
    <!-- Modal Konfigurasi Internal (Existing) -->
    <div class="modal" id="integrationModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Konfigurasi Internal</h3>
                <button class="close-btn" onclick="closeModal('integrationModal')">&times;</button>
            </div>
            <div class="form-group">
                <label>Catatan Administrator</label>
                <input type="text" placeholder="Fitur ini untuk pengembangan internal...">
            </div>
            <button class="btn" onclick="closeModal('integrationModal')">Tutup</button>
        </div>
    </div>

    <!-- MODAL PENGATURAN AKUN (BARU) -->
    <div class="modal" id="modalPengaturanAkun">
        <div class="modal-content" style="max-width: 450px;">
            <div class="modal-header">
                <h3>⚙️ Pengaturan Akun</h3>
                <button class="close-btn" onclick="closeModal('modalPengaturanAkun')">&times;</button>
            </div>
            
            <div style="background:#f0f9ff; border:1px solid #bae6fd; border-radius:8px; padding:12px; margin-bottom:20px;">
                <div style="font-size:0.85rem; color:#0369a1;">
                    <strong>📧 Email:</strong> <span id="settingUserEmail">-</span>
                </div>
            </div>

            <div class="form-group-modal">
                <label>🔒 Password Saat Ini *</label>
                <input type="password" id="settingPasswordLama" placeholder="Masukkan password lama Anda">
            </div>
            
            <div class="form-group-modal">
                <label>🔑 Password Baru *</label>
                <input type="password" id="settingPasswordBaru" placeholder="Minimal 6 karakter">
                <div class="password-hint">Password harus berbeda dengan password lama.</div>
            </div>
            
            <div class="form-group-modal">
                <label>✅ Konfirmasi Password Baru *</label>
                <input type="password" id="settingPasswordKonfirmasi" placeholder="Ulangi password baru">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 24px;">
                <button class="btn" style="flex: 1; background: #e2e8f0; color: #475569;" onclick="closeModal('modalPengaturanAkun')">Batal</button>
                <button class="btn" id="btnSimpanPengaturan" style="flex: 1; background: #10b981; color: white;">💾 Simpan Perubahan</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Portal Administrasi Sekolah Terintegrasi. Dibuat untuk efisiensi manajemen madrasah modern.
    </footer>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    
    <script type="module">
        import { AuthService } from './js/auth-service.js';

        const firebaseConfig = {
            apiKey: "AIzaSyB24GCKSTPGlN9HG9E6uhCECVa4ibCpKEA",
            authDomain: "sipelita-digital.firebaseapp.com",
            databaseURL: "https://sipelita-digital-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sipelita-digital",
            storageBucket: "sipelita-digital.firebasestorage.app",
            messagingSenderId: "787840817745",
            appId: "1:787840817745:web:e6b5237cfbb5e51be93670"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth(); // Inisialisasi Auth

        async function refreshUserDataFromFirestore(userEmail) {
            try {
                const snapshot = await db.collection('users').where('email', '==', userEmail).limit(1).get();
                if (!snapshot.empty) {
                    return snapshot.docs[0].data();
                }
                return null;
            } catch (error) {
                console.error('❌ Error refresh user data:', error);
                return null;
            }
        }

        // Fungsi helper untuk menampilkan toast/notifikasi sederhana
        function showToast(message, type = 'success') {
            alert(message); // Bisa diganti dengan library toast Anda jika ada (misal: window.toast)
        }

        // Fungsi helper untuk membuka/menutup modal
        window.closeModal = (modalId) => {
            document.getElementById(modalId).style.display = 'none';
        };

        try {
            const user = AuthService.checkAuth();

            if (user) {
                const userNameEl = document.getElementById('userName');
                if (userNameEl) userNameEl.textContent = `Hi, ${user.nama || 'User'}`;
                
                const userRoleEl = document.getElementById('userRole');
                if (userRoleEl) {
                    const roleMap = { 'admin': '👑 Admin', 'kepala': '👑 Kepala Madrasah', 'wakil': '⭐ Wakil Kepala' };
                    userRoleEl.textContent = roleMap[user.role] || '👤 Guru';
                }

                const userNipEl = document.getElementById('userNip');
                if (userNipEl) {
                    userNipEl.textContent = user.nip ? 'NIP: ' + user.nip : 'NIP: Memuat...';
                }

                if (user.email) {
                    refreshUserDataFromFirestore(user.email).then(freshData => {
                        if (freshData) {
                            const updatedUser = { ...user, ...freshData, email: user.email };
                            localStorage.setItem('sipelita_user', JSON.stringify(updatedUser));
                            
                            if (userNameEl) userNameEl.textContent = `Hi, ${updatedUser.nama || 'User'}`;
                            if (userNipEl) {
                                userNipEl.textContent = updatedUser.nip ? 'NIP: ' + updatedUser.nip : 'NIP: Belum diisi';
                                userNipEl.style.color = updatedUser.nip ? '#64748b' : '#ef4444';
                            }
                        }
                    });
                }

                // ══════════════════════════════════════════════
                // LOGIKA PENGATURAN AKUN (UBAH PASSWORD)
                // ══════════════════════════════════════════════
                const btnPengaturan = document.getElementById('btnPengaturanAkun');
                const btnSimpanPengaturan = document.getElementById('btnSimpanPengaturan');

                if (btnPengaturan) {
                    btnPengaturan.addEventListener('click', () => {
                        document.getElementById('settingUserEmail').textContent = user.email || '-';
                        document.getElementById('settingPasswordLama').value = '';
                        document.getElementById('settingPasswordBaru').value = '';
                        document.getElementById('settingPasswordKonfirmasi').value = '';
                        document.getElementById('modalPengaturanAkun').style.display = 'flex';
                    });
                }

                if (btnSimpanPengaturan) {
                    btnSimpanPengaturan.addEventListener('click', async () => {
                        const passLama = document.getElementById('settingPasswordLama').value.trim();
                        const passBaru = document.getElementById('settingPasswordBaru').value.trim();
                        const passKonfirmasi = document.getElementById('settingPasswordKonfirmasi').value.trim();
                        const currentUser = auth.currentUser;

                        if (!passLama) return showToast('❌ Password saat ini wajib diisi!', 'error');
                        if (passBaru.length < 6) return showToast('❌ Password baru minimal 6 karakter!', 'error');
                        if (passBaru !== passKonfirmasi) return showToast('❌ Konfirmasi password tidak cocok!', 'error');
                        if (passLama === passBaru) return showToast('❌ Password baru harus berbeda dengan yang lama!', 'error');

                        btnSimpanPengaturan.disabled = true;
                        btnSimpanPengaturan.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';

                        try {
                            // 1. Re-authenticate user (Keamanan Firebase)
                            const credential = firebase.auth.EmailAuthProvider.credential(currentUser.email, passLama);
                            await currentUser.reauthenticateWithCredential(credential);

                            // 2. Update password
                            await currentUser.updatePassword(passBaru);

                            showToast('✅ Password berhasil diubah! Anda akan dialihkan ke halaman login.');
                            closeModal('modalPengaturanAkun');

                            // 3. Logout otomatis setelah 2 detik
                            setTimeout(async () => {
                                localStorage.removeItem('sipelita_user');
                                sessionStorage.removeItem('sipelita_user');
                                await auth.signOut();
                                window.location.href = 'home.html';
                            }, 2000);

                        } catch (error) {
                            console.error('Error ubah password:', error);
                            let msg = 'Gagal mengubah password.';
                            if (error.code === 'auth/wrong-password') msg = '❌ Password saat ini salah!';
                            else if (error.code === 'auth/weak-password') msg = '❌ Password terlalu lemah!';
                            else if (error.code === 'auth/requires-recent-login') msg = '❌ Silakan logout dan login ulang terlebih dahulu!';
                            else msg = '❌ ' + error.message;
                            
                            showToast(msg, 'error');
                            btnSimpanPengaturan.disabled = false;
                            btnSimpanPengaturan.innerHTML = '💾 Simpan Perubahan';
                        }
                    });
                }
                
                // ══════════════════════════════════════════════
                // LOGIKA LOGOUT (DIPERBAIKI & DIOPTIMALKAN UNTUK MOBILE)
                // ══════════════════════════════════════════════
                const btnLogout = document.getElementById('btnLogout');
                if (btnLogout) {
                    btnLogout.addEventListener('click', async (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        // 1. Tampilkan loading state agar user tahu sedang diproses
                        btnLogout.disabled = true;
                        btnLogout.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Keluar...';
                        
                        try {
                            // 2. Clear SEMUA storage (lebih aman dan bersih)
                            localStorage.clear();
                            sessionStorage.clear();
                            
                            // 3. Clear Firebase Auth jika tersedia
                            if (typeof AuthService !== 'undefined' && AuthService.logout) {
                                try {
                                    await AuthService.logout();
                                } catch (err) {
                                    console.warn('Firebase logout warning:', err);
                                }
                            }
                            
                            // 4. Force redirect menggunakan replace (mencegah tombol Back browser)
                            window.location.replace('home.html');
                            
                        } catch (error) {
                            console.error('Logout error:', error);
                            // Fallback redirect jika terjadi error tak terduga
                            window.location.replace('home.html');
                        }
                    });
                }
                // ══════════════════════════════════════════════

            } else {
                // Jika tidak ada data user di AuthService, lempar ke login
                window.location.replace('home.html');
            }

        } catch (error) {
            // Fallback jika terjadi error kritis di seluruh script module
            console.error('❌ Error di script module:', error);
            const btnLogoutFallback = document.getElementById('btnLogout');
            if (btnLogoutFallback) {
                btnLogoutFallback.addEventListener('click', () => {
                    localStorage.clear();
                    window.location.replace('home.html');
                });
            }
        }
    </script>
    <script type="module" src="js/chat-widget.js"></script>
</body>
</html>
