<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Pembelajaran E-Learning - SIPELITA</title>
    <link rel="icon" type="image/png" href="../assets/images/icon-app.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <!-- Header / Navbar -->
    <header class="bg-blue-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="elearning-guru.html" class="hover:bg-blue-800 p-2 rounded-lg transition">
                    <i class="fas fa-arrow-left text-lg"></i>
                </a>
                <div>
                    <h1 class="font-bold text-lg leading-tight" id="sessionTitle">Laporan Hasil E-Learning</h1>
                    <p class="text-xs text-blue-200" id="sessionSub">Sistem Informasi Pembelajaran - SIPELITA</p>
                </div>
            </div>
            <div>
                <button onclick="exportPDFLaporan()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-semibold text-sm shadow flex items-center gap-2 transition">
                    <i class="fas fa-print"></i> Cetak / Download PDF
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Informasi Sesi & Ringkasan Statistik -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs text-slate-500 font-medium uppercase">Total Peserta</p>
                <h3 class="text-2xl font-bold text-slate-800 mt-1" id="statTotal">-</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs text-slate-500 font-medium uppercase">Sudah Mengerjakan</p>
                <h3 class="text-2xl font-bold text-blue-600 mt-1" id="statSudah">-</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs text-slate-500 font-medium uppercase">Rata-Rata Nilai</p>
                <h3 class="text-2xl font-bold text-emerald-600 mt-1" id="statRata">-</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-xs text-slate-500 font-medium uppercase">Tertinggi / Terendah</p>
                <h3 class="text-2xl font-bold text-indigo-600 mt-1" id="statMinMax">- / -</h3>
            </div>
        </div>

        <!-- Tabel Hasil Siswa -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h2 class="font-bold text-slate-700">Daftar Nilai Siswa</h2>
                <input type="text" id="searchInput" onkeyup="filterSiswa()" placeholder="Cari nama siswa..." class="px-3 py-1.5 border rounded-lg text-sm w-64 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-100 text-slate-700 uppercase text-xs">
                        <tr>
                            <th class="px-4 py-3 text-center w-12">No</th>
                            <th class="px-4 py-3">Nama Siswa</th>
                            <th class="px-4 py-3 text-center">Kelas</th>
                            <th class="px-4 py-3 text-center">Benar</th>
                            <th class="px-4 py-3 text-center">Salah</th>
                            <th class="px-4 py-3 text-center">Nilai</th>
                            <th class="px-4 py-3 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200">
                        <tr>
                            <td colspan="7" class="px-4 py-8 text-center text-slate-400">Memuat data hasil pembelajaran...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Inisialisasi Firebase & Penyiapan Variable Global -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAlVg1QKRP-1sDJmlA-YFEfHLKqhT5OzBY",
            authDomain: "sipelita-guru.firebaseapp.com",
            projectId: "sipelita-guru",
            storageBucket: "sipelita-guru.firebasestorage.app",
            messagingSenderId: "595996765157",
            appId: "1:595996765157:web:88f7f03489e1d1248e9d0c"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // 🌐 GLOBAL VARIABLES (Dibutuhkan oleh elearning-pdf.js)
        var currentSession = {};
        var daftarJawaban = [];
        var currentUser = null;
        var currentUserData = null;
        var NAMA_BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        var CONFIG_MADRASAH = {
            kop1: 'KEMENTERIAN AGAMA REPUBLIK INDONESIA',
            kop2: 'KEMENTERIAN AGAMA KABUPATEN BANTAENG',
            kop3: 'MADRASAH ALIYAH NEGERI BANTAENG',
            alamat: 'Jl. Poros Dampang Kel. Gantarangkeke Kab. Bantaeng',
            kota: 'Bantaeng',
            kepalaMadrasah: '................................................',
            nipKepala: ''
        };

        document.addEventListener('DOMContentLoaded', () => {
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    currentUser = user;
                    await loadUserProfile(user.email);
                    await fetchConfigMadrasah();
                    
                    const urlParams = new URLSearchParams(window.location.search);
                    const sessionId = urlParams.get('id');
                    if (sessionId) {
                        loadHasilData(sessionId);
                    } else {
                        alert('ID Sesi tidak ditemukan pada URL!');
                    }
                } else {
                    window.location.href = '../index.html';
                }
            });
        });

        async function loadUserProfile(email) {
            try {
                const userDoc = await db.collection('users').doc(email).get();
                if (userDoc.exists) {
                    currentUserData = userDoc.data();
                }
            } catch (e) {
                console.warn('Gagal memuat profil user:', e);
            }
        }

        async function fetchConfigMadrasah() {
            try {
                const docSnap = await db.collection('pengaturan_user').doc('madrasah_config').get();
                if (docSnap.exists) {
                    Object.assign(CONFIG_MADRASAH, docSnap.data());
                }
            } catch (e) {
                console.warn('Menggunakan konfigurasi madrasah bawaan');
            }
        }

        async function loadHasilData(sessionId) {
            try {
                // 1. Ambil Data Sesi
                const sesiSnap = await db.collection('learning_sessions').doc(sessionId).get();
                if (!sesiSnap.exists) throw new Error('Sesi tidak ditemukan');
                currentSession = { id: sesiSnap.id, ...sesiSnap.data() };

                document.getElementById('sessionTitle').textContent = currentSession.judul || 'Laporan Hasil';
                document.getElementById('sessionSub').textContent = `${currentSession.mataPelajaran || '-'} | Kelas: ${currentSession.kelasTarget || '-'}`;

                // 2. Ambil Siswa
                let semuaSiswa = [];
                if (currentSession.kelasSipenaId) {
                    const siswaSnap = await db.collection('siswa').where('kelas_id', '==', currentSession.kelasSipenaId).get();
                    siswaSnap.forEach(doc => semuaSiswa.push({ 
                        id: doc.id, 
                        nama: doc.data().student_name || doc.data().nama, 
                        kelas: currentSession.kelasTarget 
                    }));
                }

                // 3. Ambil Jawaban Siswa
                const respSnap = await db.collection('student_responses').where('sessionId', '==', sessionId).get();
                const respMap = new Map();
                respSnap.forEach(doc => respMap.set((doc.data().siswaNama || '').toLowerCase().trim(), doc.data()));

                daftarJawaban = semuaSiswa.map(s => {
                    const resp = respMap.get(s.nama.toLowerCase().trim());
                    return {
                        siswaNama: s.nama,
                        siswaKelas: s.kelas,
                        ...resp,
                        sudahKirim: !!resp
                    };
                });

                renderUI();

            } catch (err) {
                console.error(err);
                alert('Gagal memuat data: ' + err.message);
            }
        }

        function renderUI() {
            const yangSudah = daftarJawaban.filter(d => d.sudahKirim);
            const nilaiList = yangSudah.map(d => d.nilai).filter(n => n !== undefined && n !== null);
            const rata = nilaiList.length ? Math.round(nilaiList.reduce((a, b) => a + b, 0) / nilaiList.length) : 0;
            const max = nilaiList.length ? Math.max(...nilaiList) : 0;
            const min = nilaiList.length ? Math.min(...nilaiList) : 0;

            document.getElementById('statTotal').textContent = `${daftarJawaban.length} Siswa`;
            document.getElementById('statSudah').textContent = `${yangSudah.length} Siswa`;
            document.getElementById('statRata').textContent = rata;
            document.getElementById('statMinMax').textContent = `${max} / ${min}`;

            const tbody = document.getElementById('tableBody');
            if (daftarJawaban.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-8 text-center text-slate-400">Tidak ada data siswa ditemukan.</td></tr>`;
                return;
            }

            tbody.innerHTML = daftarJawaban.map((d, i) => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="px-4 py-3 text-center font-medium">${i + 1}</td>
                    <td class="px-4 py-3 font-semibold text-slate-700">${d.siswaNama}</td>
                    <td class="px-4 py-3 text-center">${d.siswaKelas || '-'}</td>
                    <td class="px-4 py-3 text-center text-emerald-600 font-medium">${d.sudahKirim ? (d.totalBenar ?? '-') : '-'}</td>
                    <td class="px-4 py-3 text-center text-rose-600 font-medium">${d.sudahKirim ? (d.totalSalah ?? '-') : '-'}</td>
                    <td class="px-4 py-3 text-center font-bold text-slate-800">${d.sudahKirim ? (d.nilai ?? '-') : '-'}</td>
                    <td class="px-4 py-3 text-center">
                        <span class="px-2 py-1 text-xs rounded-full font-semibold ${d.sudahKirim ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}">
                            ${d.sudahKirim ? 'Selesai' : 'Belum'}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        function filterSiswa() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(query) ? '' : 'none';
            });
        }
    </script>

    <!-- Memuat Skrip PDF Generator yang telah disesuaikan -->
    <script src="elearning-pdf.js"></script>

</body>
</html>
