<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Learning - SIPELITA</title>
    <link rel="icon" type="image/png" href="../assets/images/icon-app.png">
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/elearning.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="header">
        <div class="header-content">
            <div class="brand">
                <!-- ✅ Menggunakan Icon Font Awesome (Aman dari error encoding) -->
                <h1><i class="fas fa-graduation-cap"></i> E-Learning SIPELITA</h1>
                <p>Platform Belajar Online untuk Guru & Siswa</p>
            </div>
            <a href="../index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Dashboard
            </a>
        </div>
    </div>

    <div class="container">
        
        <!-- Statistik - Compact Row -->
        <div class="stats-row">
            <div class="stat-box">
                <h3>Total Sesi</h3>
                <div class="value" id="statTotal">0</div>
            </div>
            <div class="stat-box" style="border-left-color: var(--success);">
                <h3>Sesi Aktif</h3>
                <div class="value" id="statAktif" style="color: var(--success);">0</div>
            </div>
            <div class="stat-box" style="border-left-color: #8b5cf6;">
                <h3>Total Siswa Join</h3>
                <div class="value" id="statSiswa">0</div>
            </div>
            <div class="stat-box" style="border-left-color: var(--warning);">
                <h3>Rata-rata Nilai</h3>
                <div class="value" id="statNilai">-</div>
            </div>
        </div>
        
        <!-- Daftar Sesi - Vertical List -->
        <div class="card">
            <div class="card-header">
                <!-- ✅ Menggunakan Icon Font Awesome -->
                <h2><i class="fas fa-book-open"></i> Daftar Sesi Belajar</h2>
                <a href="elearning-buat.html" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Buat Sesi Baru
                </a>
            </div>
            
            <div id="loadingState" class="loading-state">
                <div class="spinner"></div>
                <p>Memuat sesi...</p>
            </div>
            
            <div id="emptyState" class="empty-state" style="display: none;">
                <!-- ✅ Menggunakan Icon Font Awesome -->
                <div class="icon"><i class="fas fa-inbox"></i></div>
                <h3>Belum Ada Sesi</h3>
                <p>Mulai buat sesi belajar pertama Anda!</p>
            </div>
            
            <div id="sessionList" class="session-list" style="display: none;"></div>
        </div>
        
    </div>

    <!-- Custom JS -->
    <script src="../js/elearning-core.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadDaftarSesi === 'function') {
                loadDaftarSesi();
            }
        });
    </script>
</body>
</html>
