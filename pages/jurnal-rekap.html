<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Jurnal Online - SIPELITA</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- ✅ Firebase SDK compat + AUTH (wajib untuk rules) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid me-2 fa-book-open text-2xl text-indigo-200"></i>
        <div>
          <h1 class="text-xl font-bold leading-tight">Rekap Jurnal Mengajar</h1>
          <p class="text-xs text-indigo-200" id="userDisplay">Memuat pengguna...</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-sm font-medium transition flex items-center shadow">
          <i class="fa-solid fa-file-excel mr-2"></i> Ekspor Excel
        </button>
        <button onclick="window.location.href='jurnal-online.html'" class="bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-lg text-sm font-medium transition">
          <i class="fa-solid fa-pen mr-1"></i> Input Jurnal
        </button>
        <button onclick="window.location.href='../index.html'" class="bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-lg text-sm font-medium transition">
          <i class="fa-solid fa-arrow-left mr-1"></i> Dashboard
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center space-x-4">
        <div class="p-3 bg-indigo-100 text-indigo-600 rounded-lg"><i class="fa-solid fa-list-check text-2xl"></i></div>
        <div>
          <p class="text-xs text-slate-500 font-medium">Total Jurnal</p>
          <h3 class="text-2xl font-bold text-slate-800" id="statTotal">0</h3>
        </div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center space-x-4">
        <div class="p-3 bg-emerald-100 text-emerald-600 rounded-lg"><i class="fa-solid fa-filter text-2xl"></i></div>
        <div>
          <p class="text-xs text-slate-500 font-medium">Tersaring</p>
          <h3 class="text-2xl font-bold text-slate-800" id="statFiltered">0</h3>
        </div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center space-x-4">
        <div class="p-3 bg-amber-100 text-amber-600 rounded-lg"><i class="fa-solid fa-user-graduate text-2xl"></i></div>
        <div>
          <p class="text-xs text-slate-500 font-medium">Total Kelas Terekam</p>
          <h3 class="text-2xl font-bold text-slate-800" id="statKelas">0</h3>
        </div>
      </div>
    </div>

    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <h2 class="font-semibold text-slate-700 flex items-center">
          <i class="fa-solid fa-sliders mr-2 text-indigo-600"></i> Filter Data Jurnal
        </h2>
        <button onclick="resetFilters()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">Reset Filter</button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Cari Kata Kunci</label>
          <input type="text" id="filterSearch" oninput="applyFilters()" placeholder="Cari materi / mapel..." 
                 class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Filter Guru</label>
          <select id="filterGuru" onchange="applyFilters()" class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="">-- Semua Guru --</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Filter Kelas</label>
          <select id="filterKelas" onchange="applyFilters()" class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="">-- Semua Kelas --</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal</label>
          <input type="date" id="filterTanggal" onchange="applyFilters()" 
                 class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-100 text-slate-700 font-semibold uppercase text-xs border-b border-slate-200">
            <tr>
              <th class="p-4 w-12 text-center">No</th>
              <th class="p-4">Tanggal / Jam</th>
              <th class="p-4">Guru</th>
              <th class="p-4">Kelas</th>
              <th class="p-4">Materi / Kegiatan</th>
              <th class="p-4 text-center">Absensi</th>
              <th class="p-4 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-slate-200">
            <tr>
              <td colspan="7" class="p-8 text-center text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                <p>Memuat data rekap...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <div id="detailModal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl max-w-2xl w-full p-6 space-y-4 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold text-slate-800" id="modalTitle">Detail Jurnal</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div id="modalContent" class="space-y-3 text-sm text-slate-700"></div>
      <div class="border-t pt-3 text-right">
        <button onclick="closeModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg font-medium text-sm">Tutup</button>
      </div>
    </div>
  </div>

  <script>
    // ✅ CONFIG BENAR (project sipelita-guru)
    const firebaseConfig = {
      apiKey: "AIzaSyAlVg1QKRP-1sDJmlA-YFEfHLKqhT5OzBY",
      authDomain: "sipelita-guru.firebaseapp.com",
      projectId: "sipelita-guru",
      storageBucket: "sipelita-guru.firebasestorage.app",
      messagingSenderId: "595996765157",
      appId: "1:595996765157:web:88f7f03489e1d1248e9d0c"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let allJurnal = [];
    let filteredJurnal = [];
    let currentUser = null;
    let isEvaluator = false;

    document.addEventListener("DOMContentLoaded", () => {
      // ✅ TUNGGU AUTH SIAP (rules butuh request.auth != null)
      auth.onAuthStateChanged(user => {
        if (!user) {
          alert('Sesi login tidak ditemukan. Silakan login terlebih dahulu.');
          window.location.href = '../index.html';
          return;
        }
        initSession();
        loadRekapJurnal();
      });
    });

    function initSession() {
      const userRaw = localStorage.getItem('sipelita_user');
      if (userRaw) {
        try {
          const userObj = JSON.parse(userRaw);
          currentUser = userObj.nama || userObj.username || "Pengguna";
          isEvaluator = userObj.role === 'evaluator' || userObj.role === 'admin' || userObj.role === 'kepala' || userObj.role === 'wakil';
        } catch (e) { currentUser = "Pengguna"; }
      } else { currentUser = "Pengguna"; }

      document.getElementById('userDisplay').innerText = `${currentUser} (${isEvaluator ? 'Evaluator' : 'Guru'})`;
      
      const filterGuruElem = document.getElementById('filterGuru');
      if (!isEvaluator) {
        filterGuruElem.disabled = true;
        filterGuruElem.parentElement.classList.add('opacity-50');
      }
    }

    async function loadRekapJurnal() {
      const tbody = document.getElementById('tableBody');
      try {
        let snapshot;
        
        if (isEvaluator) {
          snapshot = await db.collection('jurnal_online').get();
        } else {
          snapshot = await db.collection('jurnal_online')
            .where('guruNama', '==', currentUser)
            .get();
        }

        allJurnal = [];
        const guruSet = new Set();
        const kelasSet = new Set();

        snapshot.forEach(doc => {
          const data = { id: doc.id, ...doc.data() };
          allJurnal.push(data);
          if (data.guruNama) guruSet.add(data.guruNama);
          if (data.kelas) kelasSet.add(data.kelas);
        });

        allJurnal.sort((a, b) => new Date(b.tanggal || 0) - new Date(a.tanggal || 0));

        populateDropdown('filterGuru', Array.from(guruSet));
        populateDropdown('filterKelas', Array.from(kelasSet));

        document.getElementById('statTotal').innerText = allJurnal.length;
        document.getElementById('statKelas').innerText = kelasSet.size;

        applyFilters();

      } catch (error) {
        console.error("Gagal memuat jurnal:", error);
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="p-6 text-center text-red-500">
              <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
              <p class="font-semibold">Terjadi Kesalahan Kueri / Hak Akses</p>
              <p class="text-xs text-slate-500 mt-1">${error.message}</p>
            </td>
          </tr>
        `;
      }
    }

    function populateDropdown(elemId, options) {
      const select = document.getElementById(elemId);
      const currentVal = select.value;
      select.innerHTML = select.options[0].outerHTML;
      options.sort().forEach(opt => {
        const el = document.createElement('option');
        el.value = opt;
        el.textContent = opt;
        select.appendChild(el);
      });
      select.value = currentVal;
    }

    function applyFilters() {
      const search = document.getElementById('filterSearch').value.toLowerCase();
      const guru = document.getElementById('filterGuru').value;
      const kelas = document.getElementById('filterKelas').value;
      const tanggal = document.getElementById('filterTanggal').value;

      filteredJurnal = allJurnal.filter(item => {
        const matchSearch = !search || 
          (item.materi && item.materi.toLowerCase().includes(search)) ||
          (item.mapel && item.mapel.toLowerCase().includes(search));
        const matchGuru = !guru || item.guruNama === guru;
        const matchKelas = !kelas || item.kelas === kelas;
        const matchTanggal = !tanggal || item.tanggal === tanggal;
        return matchSearch && matchGuru && matchKelas && matchTanggal;
      });

      document.getElementById('statFiltered').innerText = filteredJurnal.length;
      renderTable(filteredJurnal);
    }

    function resetFilters() {
      document.getElementById('filterSearch').value = '';
      if (isEvaluator) document.getElementById('filterGuru').value = '';
      document.getElementById('filterKelas').value = '';
      document.getElementById('filterTanggal').value = '';
      applyFilters();
    }

    // ✅ FIELD DISINKRONKAN dengan jurnal-online.js
    function getJam(item) { return item.jamDisplay || (item.jamRange ? 'Jam ' + item.jamRange : ('Jam ke-' + (item.jamKe || '-'))); }
    function getHadir(item) { return item.muridHadir ?? item.hadir ?? 0; }
    function getTidakHadir(item) { return item.muridTidakHadir ?? ((item.sakit||0)+(item.izin||0)+(item.alpa||0)); }
    function getKeterangan(item) { return item.keterangan || item.catatan || ''; }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-400">Tidak ada data jurnal yang sesuai filter.</td></tr>`;
        return;
      }

      data.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 transition border-b border-slate-100";
        
        tr.innerHTML = `
          <td class="p-4 text-center font-medium text-slate-400">${index + 1}</td>
          <td class="p-4 whitespace-nowrap">
            <div class="font-medium text-slate-800">${item.tanggal || '-'}</div>
            <div class="text-xs text-slate-400">${getJam(item)}</div>
          </td>
          <td class="p-4 font-medium text-slate-700">${item.guruNama || '-'}</td>
          <td class="p-4 whitespace-nowrap">
            <span class="inline-block px-2 py-1 bg-indigo-50 text-indigo-700 font-semibold rounded text-xs">${item.kelas || '-'}</span>
          </td>
          <td class="p-4 max-w-xs truncate" title="${(item.materi || '').replace(/"/g, '&quot;')}">${item.materi || '-'}</td>
          <td class="p-4 text-center whitespace-nowrap">
            <div class="flex items-center justify-center space-x-1">
              <span class="text-xs bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded">H: ${getHadir(item)}</span>
              <span class="text-xs bg-rose-100 text-rose-800 px-1.5 py-0.5 rounded">TH: ${getTidakHadir(item)}</span>
            </div>
          </td>
          <td class="p-4 text-center">
            <button onclick="openModal('${item.id}')" class="text-indigo-600 hover:text-indigo-900 font-medium text-xs bg-indigo-50 hover:bg-indigo-100 px-2.5 py-1.5 rounded-md transition">
              <i class="fa-solid fa-eye mr-1"></i> Detail
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openModal(id) {
      const item = allJurnal.find(j => j.id === id);
      if (!item) return;

      document.getElementById('modalTitle').innerText = `Detail Jurnal - ${item.tanggal || ''}`;
      
      document.getElementById('modalContent').innerHTML = `
        <div class="grid grid-cols-2 gap-2 bg-slate-50 p-3 rounded-lg text-xs border border-slate-200">
          <div><strong class="text-slate-500">Guru:</strong> <p class="text-sm font-semibold">${item.guruNama || '-'}</p></div>
          <div><strong class="text-slate-500">NIP:</strong> <p class="text-sm font-semibold">${item.nip || '-'}</p></div>
          <div><strong class="text-slate-500">Kelas:</strong> <p class="text-sm font-semibold">${item.kelas || '-'}</p></div>
          <div><strong class="text-slate-500">Jam Mengajar:</strong> <p class="text-sm font-semibold">${getJam(item)}</p></div>
          <div><strong class="text-slate-500">Tanggal:</strong> <p>${item.tanggal || '-'}</p></div>
          <div><strong class="text-slate-500">Email:</strong> <p>${item.userEmail || '-'}</p></div>
        </div>

        <div>
          <h4 class="font-semibold text-xs text-slate-500 uppercase mb-1">Materi / Kegiatan Pembelajaran</h4>
          <p class="p-3 bg-white border rounded-lg text-slate-700 whitespace-pre-line">${item.materi || '-'}</p>
        </div>

        <div>
          <h4 class="font-semibold text-xs text-slate-500 uppercase mb-1">Keterangan</h4>
          <p class="p-3 bg-white border rounded-lg text-slate-700 whitespace-pre-line">${getKeterangan(item) || 'Tidak ada keterangan.'}</p>
        </div>

        <div>
          <h4 class="font-semibold text-xs text-slate-500 uppercase mb-1">Kehadiran Siswa</h4>
          <div class="grid grid-cols-2 gap-2 text-center text-xs">
            <div class="bg-emerald-50 text-emerald-700 p-2 rounded border border-emerald-200"><span class="block font-bold text-lg">${getHadir(item)}</span> Hadir</div>
            <div class="bg-rose-50 text-rose-700 p-2 rounded border border-rose-200"><span class="block font-bold text-lg">${getTidakHadir(item)}</span> Tidak Hadir</div>
          </div>
        </div>
      `;

      const modal = document.getElementById('detailModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('detailModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // ✅ EKSPOR DENGAN FIELD TERSINKRON
    function exportToExcel() {
      if (filteredJurnal.length === 0) { alert("Tidak ada data untuk diekspor!"); return; }

      const exportData = filteredJurnal.map((item, index) => ({
        "No": index + 1,
        "Tanggal": item.tanggal || '',
        "Jam Mengajar": getJam(item),
        "Nama Guru": item.guruNama || '',
        "NIP": item.nip || '',
        "Kelas": item.kelas || '',
        "Materi Pembelajaran": item.materi || '',
        "Keterangan": getKeterangan(item),
        "Murid Hadir": getHadir(item),
        "Murid Tidak Hadir": getTidakHadir(item)
      }));

      const worksheet = XLSX.utils.json_to_sheet(exportData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Rekap Jurnal");

      const fileName = `Rekap_Jurnal_${new Date().toISOString().slice(0, 10)}.xlsx`;
      XLSX.writeFile(workbook, fileName);
    }
  </script>
</body>
</html>
