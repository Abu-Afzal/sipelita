<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0891b2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SIPELITA">
<meta name="application-name" content="SIPELITA">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./assets/images/sipelita-app.png">
<link rel="icon" type="image/png" href="./assets/images/sipelita-app.png">
<title>SIPELITA – Portal Guru</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<!-- Service Worker (PWA) -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('✅ Service Worker registered:', reg.scope))
      .catch(err => console.log('❌ SW failed:', err));
  });
}
</script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #f6f8fa;               /* ✅ putih lembut, tidak silau */
    color: #1e293b;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }

  /* ── TOPBAR ── */
  .topbar {
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
    padding: 14px 24px;
    display: flex; align-items: center; gap: 12px;
  }
  .topbar img { width: 42px; height: 42px; object-fit: contain; }
  .topbar .brand { font-weight: 800; font-size: 1.15rem; color: #0e7490; letter-spacing: .5px; }
  .topbar .tagline { font-size: .74rem; color: #64748b; }

  /* ── AREA TENGAH ── */
  .main {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 48px 16px;
  }
  .login-wrap { width: 100%; max-width: 430px; }

  .welcome { text-align: center; margin-bottom: 26px; }
  .welcome h1 { font-size: 1.55rem; color: #0f172a; margin-bottom: 6px; }
  .welcome p  { color: #64748b; font-size: .92rem; }

  /* ✅ KARTU LOGIN WARNA ADEM */
  .login-card {
    background: linear-gradient(160deg, #e8f6f8 0%, #e9f5f0 100%);
    border: 1px solid #d3e8e6;
    border-radius: 18px;
    padding: 32px 28px;
    box-shadow: 0 10px 30px rgba(14, 116, 144, .10);
  }
  .login-card h2 {
    text-align: center; color: #0e7490;
    font-size: 1.3rem; margin-bottom: 4px;
  }
  .login-card .subtitle {
    text-align: center; color: #64748b;
    font-size: .85rem; margin-bottom: 24px;
  }

  /* ── INPUT ── */
  .form-group { margin-bottom: 16px; }
  .input-icon-wrapper { position: relative; }
  .input-icon-wrapper .icon-main {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: #0891b2; font-size: 1rem; z-index: 2;
  }
  .input-icon-wrapper input {
    width: 100%;
    padding: 13px 44px 13px 42px;
    border: 1.5px solid #d7e3e8;
    border-radius: 10px;
    background: #ffffff;
    font-size: .95rem;
    color: #0f172a;
    outline: none;
    transition: all .25s ease;
  }
  .input-icon-wrapper input:focus {
    border-color: #0891b2;
    box-shadow: 0 0 0 4px rgba(8, 145, 178, .14);
  }
  .input-icon-wrapper input::placeholder { color: #94a3b8; }
  .input-icon-wrapper .toggle-password {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    color: #64748b; cursor: pointer; z-index: 2;
  }
  .input-icon-wrapper .toggle-password:hover { color: #0891b2; }

  /* ── INGAT SAYA ── */
  .remember-me-container { margin: 4px 0 18px; }
  .remember-me-label {
    display: flex; align-items: center; gap: 8px;
    color: #475569; font-size: .88rem; cursor: pointer; user-select: none;
  }
  .remember-me-label input[type="checkbox"] {
    width: 17px; height: 17px; accent-color: #0891b2; cursor: pointer;
  }

  /* ── TOMBOL LOGIN ── */
  .btn-inline-login {
    width: 100%;
    padding: 14px;
    border: none; border-radius: 10px;
    background: linear-gradient(135deg, #0891b2 0%, #0e7490 100%);
    color: #fff; font-weight: 700; font-size: .98rem;
    cursor: pointer; letter-spacing: .3px;
    box-shadow: 0 4px 14px rgba(8, 145, 178, .30);
    transition: all .25s ease;
  }
  .btn-inline-login:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(8, 145, 178, .40); }
  .btn-inline-login:active { transform: translateY(0); }

  /* ── PESAN ERROR ── */
  .error-msg {
    display: none;
    background: #fee2e2; color: #991b1b;
    border: 1px solid #fca5a5; border-radius: 10px;
    padding: 11px 14px; margin-bottom: 16px;
    font-size: .88rem; font-weight: 600;
  }

  /* ── BANTUAN ── */
  .help-link {
    display: flex; justify-content: center; align-items: center; gap: 8px;
    margin-top: 18px; color: #64748b; font-size: .85rem; text-decoration: none;
  }
  .help-link:hover { color: #0891b2; }

  /* ── FOOTER ── */
  .footer {
    text-align: center; padding: 18px;
    color: #94a3b8; font-size: .8rem;
  }

  @media (max-width: 480px) {
    .login-card { padding: 26px 20px; }
    .welcome h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>

  <!-- ══ TOPBAR NETRAL ══ -->
  <div class="topbar">
    <img src="assets/images/sipelita-app.png" alt="SIPELITA">
    <div>
      <div class="brand">SIPELITA</div>
      <div class="tagline">Sistem Pengelolaan Edukasi &amp; Layanan Terpadu</div>
    </div>
  </div>

  <!-- ══ KONTEN UTAMA ══ -->
  <div class="main">
    <div class="login-wrap">

      <div class="welcome">
        <h1>Selamat Datang, Bapak/Ibu Guru</h1>
        <p>Portal personal untuk manajemen kelas &amp; administrasi pembelajaran</p>
      </div>

      <div class="login-card">
        <h2>🔐 LOGIN PORTAL</h2>
        <p class="subtitle">Masuk untuk melanjutkan ke dashboard Anda</p>

        <div id="errorMsg" class="error-msg"></div>

        <form id="landingLoginForm" autocomplete="on">
          <div class="form-group">
            <div class="input-icon-wrapper">
              <i class="fas fa-envelope icon-main"></i>
              <input type="email" id="email" placeholder="Masukkan email Anda" required autocomplete="email">
            </div>
          </div>

          <div class="form-group">
            <div class="input-icon-wrapper">
              <i class="fas fa-lock icon-main"></i>
              <input type="password" id="password" placeholder="Masukkan password" required autocomplete="current-password">
              <i class="fas fa-eye-slash toggle-password" id="togglePassword"></i>
            </div>
          </div>

          <div class="remember-me-container">
            <label class="remember-me-label" for="rememberMe">
              <input type="checkbox" id="rememberMe">
              Ingat Saya
            </label>
          </div>

          <button type="submit" id="btnLogin" class="btn-inline-login">MASUK PORTAL</button>
        </form>
      </div>

      <a class="help-link" href="https://wa.me/6281347027844" target="_blank">
        <i class="fab fa-whatsapp"></i> Butuh bantuan? Hubungi Admin
      </a>

    </div>
  </div>

  <!-- ══ FOOTER NETRAL ══ -->
  <footer class="footer">
    &copy; 2026 SIPELITA · Portal Personal Guru
  </footer>

  <!-- Script login (WAJIB dipertahankan) -->
  <script type="module" src="js/home-auth.js"></script>
</body>
</html>
